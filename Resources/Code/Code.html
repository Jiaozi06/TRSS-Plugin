<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline' file:; img-src data:; font-src file:"
    />
    <link rel="stylesheet" href="{{htmlDir}}Code.css" />
  </head>
  <body>
    <main id="container" class="container">
      <div class="eyebrow">TRSS / CONSOLE</div>
      <div class="title">{{if title}}{{title}}{{else}}运行输出{{/if}}</div>
      <div class="subtitle">命令结果与系统记录</div>
      <div class="accent"></div>
      <section class="box terminal">
        <div class="terminal-bar"><i></i><i></i><i></i></div>
        {{@Code}}
      </section>
      <footer class="copyright"><span>TRSS PLUGIN</span><span>简洁 · 清晰</span></footer>
    </main>
  </body>
</html>
